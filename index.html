<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestion des Patients</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="photo.png" type="image/x-icon" />
  </head>
  <body>
    <table id="patientTable">
      <thead>
        <tr>
          <td>
            <form
              onsubmit="
                event.preventDefault();
                onFormsubmit();
              "
              autocomplete="off"
              id="patientForm"
            >
              <div>
                <label for="nom">Nom:</label>
                <input
                  type="text"
                  name="nom"
                  id="nom"
                  placeholder="Nom"
                  required
                />
              </div>

              <div>
                <label for="prenom">Prénom:</label>
                <input
                  type="text"
                  name="prenom"
                  id="prenom"
                  placeholder="Prénom"
                  required
                />
              </div>

              <div>
                <label for="age">Âge:</label>
                <input
                  type="number"
                  name="age"
                  id="age"
                  placeholder="Âge"
                  required
                />
              </div>

              <div>
                <label for="addresse">Adresse:</label>
                <input
                  type="text"
                  name="addresse"
                  id="addresse"
                  placeholder="Adresse"
                  required
                />
              </div>

              <div>
                <label for="phone">Téléphone:</label>
                <input
                  type="tel"
                  name="phone"
                  id="phone"
                  placeholder="Téléphone"
                  required
                />
              </div>

              <div class="form-action-buttons">
                <input type="submit" value="Submit" />
              </div>
            </form>
          </td>

          <td>
            <table class="list" id="patient_liste">
              <thead>
                <tr>
                  <th>Nom</th>
                  <th>Prénom</th>
                  <th>Âge</th>
                  <th>Adresse</th>
                  <th>Téléphone</th>
                  <th></th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </td>
        </tr>
      </thead>
      <tbody>
        <!-- Les patients seront ajoutés ici dynamiquement -->
      </tbody>
    </table>
    <input
      type="text"
      id="searchInput"
      onkeyup="searchTable()"
      placeholder="Rechercher un patient..."
    />
    <script src="script.js"></script>
  </body>
</html>
